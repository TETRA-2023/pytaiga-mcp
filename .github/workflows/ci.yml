name: CI

on:
  push:
    # feature/taiga-v3: v3 integration branch. Image push and
    # release stay gated on refs/heads/main below, so nothing from it is published.
    branches: [main, feature/taiga-v3]
  pull_request:
    branches: [main, feature/taiga-v3]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repo (full history)
        run: gitleaks detect --no-banner --redact --verbose

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit tests
        run: uv run pytest -m "not integration" -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  docker:
    needs: [secrets, test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      SMOKE_NAME: smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image name
        id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container smoke test: start the REAL image through its entrypoint and
      # transport, then initialize + tools/list. Unit tests stayed green while
      # langfuse-mcp v1.1.6/v1.1.7 crash-looped at import in prod (2026-10-07,
      # TETRA-2023/langfuse-mcp#81); this step is what catches that. Dummy
      # credentials only: tools/list must not need a live Taiga. The server runs with --network none, so CI never
      # calls a real upstream (EPO OPS, PPUBS, ...). No host port is published,
      # and the script is piped on stdin (no bind mount: self-hosted runners
      # drive the HOST daemon, which cannot see the runner's workspace).
      - name: Smoke test image (initialize + tools/list)
        run: |
          docker run -d --network none --name "$SMOKE_NAME" \
            -e TAIGA_API_URL=http://127.0.0.1:9 \
            -e TAIGA_TRANSPORT=streamable-http \
            -e MCP_HOST=0.0.0.0 \
            mcp-smoke:ci --streamable-http
          docker run --rm -i --network "container:$SMOKE_NAME" python:3.12-alpine \
            python - http http://127.0.0.1:8000/mcp --wait 60 \
            < scripts/ci/mcp-smoke.py
        timeout-minutes: 3

      - name: Smoke test logs and cleanup
        if: always()
        run: |
          docker logs --tail 50 "$SMOKE_NAME" 2>&1 || true
          docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (:latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.repo.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tag only (Taiga #2870): tags vX.Y.Z and creates the GitHub Release with the
  # tetra-release App, nothing is committed to main. The tag (pushed by the App,
  # not GITHUB_TOKEN) triggers release-image.yml. release.yml is a byte-identical
  # copy of TETRA-2023/ci-workflows' release.yml: that repo is private, so a
  # public repo cannot call it. Change it there first, then copy it here.
  release:
    needs: [secrets, test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    with:
      client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      runs-on: ubuntu-latest
    secrets:
      app-key: ${{ secrets.RELEASE_APP_KEY }}
