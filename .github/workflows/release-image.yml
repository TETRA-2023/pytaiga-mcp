name: Release Image

on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SMOKE_NAME: smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image name
        id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gate :stable on the smoke test: a failing image is never pushed, so
      # Watchtower keeps running the previous :stable.
      - name: Build image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-smoke:ci
          cache-from: type=gha

      # Container smoke test: start the REAL image through its entrypoint and
      # transport, then initialize + tools/list. Unit tests stayed green while
      # langfuse-mcp v1.1.6/v1.1.7 crash-looped at import in prod (2026-10-07,
      # TETRA-2023/langfuse-mcp#81); this step is what catches that. Dummy
      # credentials only: tools/list must not need a live Taiga. The server runs with --network none, so CI never
      # calls a real upstream (EPO OPS, PPUBS, ...). No host port is published,
      # and the script is piped on stdin (no bind mount: self-hosted runners
      # drive the HOST daemon, which cannot see the runner's workspace).
      - name: Smoke test image (initialize + tools/list)
        run: |
          docker run -d --network none --name "$SMOKE_NAME" \
            -e TAIGA_API_URL=http://127.0.0.1:9 \
            -e TAIGA_TRANSPORT=streamable-http \
            -e MCP_HOST=0.0.0.0 \
            mcp-smoke:ci --streamable-http
          docker run --rm -i --network "container:$SMOKE_NAME" python:3.12-alpine \
            python - http http://127.0.0.1:8000/mcp --wait 60 \
            < scripts/ci/mcp-smoke.py
        timeout-minutes: 3

      - name: Smoke test logs and cleanup
        if: always()
        run: |
          docker logs --tail 50 "$SMOKE_NAME" 2>&1 || true
          docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true

      - name: Build and push image (:stable + :version)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo.outputs.image }}:stable
            ${{ steps.repo.outputs.image }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
