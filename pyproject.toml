[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-taiga-bridge"
# Real version = git tag vX.Y.Z (see GitHub Releases); never bumped here. Taiga #2870.
version = "0.0.0"
description = "Taiga integration bridge for MCP"
requires-python = ">=3.12"
authors = [{ name = "Talha Orak", email = "talhaorak.git@gmail.com" }]
maintainers = [{ name = "TETRA" }]
dependencies = [
    "mcp[cli]>=1.28.1,<2",
    "python-dotenv>=0.15.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    # Taiga HTTP client (src/taiga_client.py). Already pulled in by mcp; declared
    # because we import it directly.
    "httpx>=0.28.1",
    # Runs sync tools in worker threads (src/server/app.py:tool). Also pulled in by mcp.
    "anyio>=4.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
]

[project.scripts]
mcp-taiga = "src.server.app:main"
# Pre-v3 name, kept for the v3.x line so existing launch configs keep working.
mcp-taiga-workflow = "src.server.app:main"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools.packages.find]
# Discover src and its subpackages (src.server, src.server.tools). The old
# `packages = ["src"]` shipped only top-level modules: a non-editable install
# (the Docker image) then lacked src.server and the entry point crashed at import.
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line length handled separately

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Run unit tests",
    "integration: Run integration tests",
    "slow: Mark tests as slow-running",
    "auth: Authentication tests",
    "core: Core functionality tests",
    "projects: Project-related tests",
    "epics: Epic-related tests",
    "user_stories: User story-related tests",
    "tasks: Task-related tests",
    "issues: Issue-related tests",
    "sprints: Sprint-related tests",
]
addopts = "-v"

# Tag only: .github/workflows/release.yml tags the commit and creates the
# GitHub Release; nothing is committed to main.
[tool.semantic_release]
branch = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[dependency-groups]
dev = [
    "python-semantic-release>=10.6.1",
]
